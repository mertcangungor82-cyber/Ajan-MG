name: Build Ajan M&G APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Ajan M&G project
        shell: bash
        run: |
          mkdir -p "$(dirname 'settings.gradle')"
          echo '' | base64 -d > 'settings.gradle'
          mkdir -p "$(dirname 'build.gradle')"
          echo 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNS4yJyBhcHBseSBmYWxzZQp9Cg==' | base64 -d > 'build.gradle'
          mkdir -p "$(dirname 'gradle.properties')"
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD1mYWxzZQphbmRyb2lkLm5vblRyYW5zaXRpdmVSQ2xhc3M9dHJ1ZQo=' | base64 -d > 'gradle.properties'
          mkdir -p "$(dirname 'app/build.gradle')"
          echo '' | base64 -d > 'app/build.gradle'
          mkdir -p "$(dirname 'app/proguard-rules.pro')"
          echo 'IyBWMTogbm8gY3VzdG9tIHNocmlua2VyIHJ1bGVzIHJlcXVpcmVkLgo=' | base64 -d > 'app/proguard-rules.pro'
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          echo '' | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p "$(dirname 'app/src/main/java/com/mg/ajan/AgentMemory.java')"
          echo '' | base64 -d > 'app/src/main/java/com/mg/ajan/AgentMemory.java'
          mkdir -p "$(dirname 'app/src/main/java/com/mg/ajan/DriveVault.java')"
          echo '' | base64 -d > 'app/src/main/java/com/mg/ajan/DriveVault.java'
          mkdir -p "$(dirname 'app/src/main/java/com/mg/ajan/MainActivity.java')"
          echo '' | base64 -d > 'app/src/main/java/com/mg/ajan/MainActivity.java'
          mkdir -p "$(dirname 'app/src/main/java/com/mg/ajan/ProjectGenerator.java')"
          echo '' | base64 -d > 'app/src/main/java/com/mg/ajan/ProjectGenerator.java'
          mkdir -p "$(dirname 'app/src/main/java/com/mg/ajan/TaskEngine.java')"
          echo '' | base64 -d > 'app/src/main/java/com/mg/ajan/TaskEngine.java'
          mkdir -p "$(dirname 'app/src/main/res/values/colors.xml')"
          echo '' | base64 -d > 'app/src/main/res/values/colors.xml'
          mkdir -p "$(dirname 'app/src/main/res/values/styles.xml')"
          echo '' | base64 -d > 'app/src/main/res/values/styles.xml'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Ajan-MG-V1.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ajan-MG-V1
          path: Ajan-MG-V1.apk
          if-no-files-found: error

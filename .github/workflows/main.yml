name: Build Ajan M&G V2 Local AI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get llama.cpp Android source
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: b29c606
          path: llama
          fetch-depth: 1

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install Android build tools
        shell: bash
        run: | yes | sdkmanager --licenses >/dev/null || true sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6" 
      - name: Brand as Ajan M&G Local AI
        shell: bash
        run: | cd llama/examples/llama.android sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Ajan M\&amp;G Local AI</string>#' app/src/main/res/values/strings.xml sed -i 's/applicationId = "com.example.llama.aichat"/applicationId = "com.mg.ajan.localai"/' app/build.gradle.kts 
      - name: Build Local AI APK
        shell: bash
        run: | cd llama/examples/llama.android chmod +x gradlew ./gradlew :app:assembleDebug --no-daemon --stacktrace 
      - name: Prepare APK
        shell: bash
        run: | cp llama/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk Ajan-MG-V2-LocalAI.apk 
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ajan-MG-V2-LocalAI
          path: Ajan-MG-V2-LocalAI.apk

name: Build Ajan MG Final V3

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Get llama.cpp Android source
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          path: llama
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Part 1
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10667306678/zip > part1.zip
          unzip -o part1.zip
          test -s AjanMG.part1.b64

      - name: Write Part 2
        run: |
          truncate -s 0 AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64
          printf '%s' '' >> AjanMG.part2.b64

      - name: Rebuild final source overlay
        run: |
          cat AjanMG.part1.b64 AjanMG.part2.b64 | base64 -d > source.tar.xz
          test -s source.tar.xz
          tar -xJf source.tar.xz -C llama/examples/llama.android
          test -f llama/examples/llama.android/app/src/main/java/com/example/llama/MainActivity.kt

      - name: Set final package and version
        run: |
          sed -i 's/applicationId = "com.example.llama.aichat"/applicationId = "com.mg.ajanfull"/' llama/examples/llama.android/app/build.gradle.kts
          sed -i 's/versionCode = 1/versionCode = 10/' llama/examples/llama.android/app/build.gradle.kts
          sed -i 's/versionName = "1.0"/versionName = "1.0.0"/' llama/examples/llama.android/app/build.gradle.kts

      - name: Accept Android licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android packages
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Build Ajan MG
        run: |
          cd llama/examples/llama.android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp llama/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk Ajan-MG.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ajan-MG
          path: Ajan-MG.apk
          if-no-files-found: error

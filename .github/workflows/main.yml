name: Build Ajan MG Final

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get llama.cpp Android source
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          path: llama
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare app_src_main_androidmanifest_xml
        run: mkdir -p "$(dirname 'llama/examples/llama.android/app/src/main/AndroidManifest.xml')" && truncate -s 0 /tmp/app_src_main_androidmanifest_xml.b64

      - name: Write app_src_main_androidmanifest_xml 1
        run: printf '%s' '' >> /tmp/app_src_main_androidmanifest_xml.b64

      - name: Write app_src_main_androidmanifest_xml 2
        run: printf '%s' '4nV6weVo4uGDUpnzn20GFX6Mn9PV9ySbmA2gT+KGZHhWwzfwCXr/hyHDL2Y5ewf+Ts7GlQQAAA==' >> /tmp/app_src_main_androidmanifest_xml.b64

      - name: Decode app_src_main_androidmanifest_xml
        run: base64 -d /tmp/app_src_main_androidmanifest_xml.b64 | gzip -d > 'llama/examples/llama.android/app/src/main/AndroidManifest.xml'

      - name: Prepare app_src_main_res_drawable_ic_ajan_mg_logo_xml
        run: mkdir -p "$(dirname 'llama/examples/llama.android/app/src/main/res/drawable/ic_ajan_mg_logo.xml')" && truncate -s 0 /tmp/app_src_main_res_drawable_ic_ajan_mg_logo_xml.b64

      - name: Write app_src_main_res_drawable_ic_ajan_mg_logo_xml 1
        run: printf '%s' '' >> /tmp/app_src_main_res_drawable_ic_ajan_mg_logo_xml.b64

      - name: Decode app_src_main_res_drawable_ic_ajan_mg_logo_xml
        run: base64 -d /tmp/app_src_main_res_drawable_ic_ajan_mg_logo_xml.b64 | gzip -d > 'llama/examples/llama.android/app/src/main/res/drawable/ic_ajan_mg_logo.xml'

      - name: Prepare app_src_main_res_layout_activity_main_xml
        run: mkdir -p "$(dirname 'llama/examples/llama.android/app/src/main/res/layout/activity_main.xml')" && truncate -s 0 /tmp/app_src_main_res_layout_activity_main_xml.b64

      - name: Write app_src_main_res_layout_activity_main_xml 1
        run: printf '%s' '' >> /tmp/app_src_main_res_layout_activity_main_xml.b64

      - name: Write app_src_main_res_layout_activity_main_xml 2
        run: printf '%s' '' >> /tmp/app_src_main_res_layout_activity_main_xml.b64

      - name: Write app_src_main_res_layout_activity_main_xml 3
        run: printf '%s' '' >> /tmp/app_src_main_res_layout_activity_main_xml.b64

      - name: Decode app_src_main_res_layout_activity_main_xml
        run: base64 -d /tmp/app_src_main_res_layout_activity_main_xml.b64 | gzip -d > 'llama/examples/llama.android/app/src/main/res/layout/activity_main.xml'

      - name: Prepare app_src_main_res_values_themes_xml
        run: mkdir -p "$(dirname 'llama/examples/llama.android/app/src/main/res/values/themes.xml')" && truncate -s 0 /tmp/app_src_main_res_values_themes_xml.b64

      - name: Write app_src_main_res_values_themes_xml 1
        run: printf '%s' '' >> /tmp/app_src_main_res_values_themes_xml.b64

      - name: Decode app_src_main_res_values_themes_xml
        run: base64 -d /tmp/app_src_main_res_values_themes_xml.b64 | gzip -d > 'llama/examples/llama.android/app/src/main/res/values/themes.xml'

      - name: Prepare app_src_main_res_values_strings_xml
        run: mkdir -p "$(dirname 'llama/examples/llama.android/app/src/main/res/values/strings.xml')" && truncate -s 0 /tmp/app_src_main_res_values_strings_xml.b64

      - name: Write app_src_main_res_values_strings_xml 1
        run: printf '%s' 'H4sIAIKmsWoC/7MpSi3OLy1KTi2241IAApvikqLMvHSFvMTcVFulxIKCeBBLyc4xKzFPwVctMbfA2t1GH6LIjstGH0k7AO3x/dZLAAAA' >> /tmp/app_src_main_res_values_strings_xml.b64

      - name: Decode app_src_main_res_values_strings_xml
        run: base64 -d /tmp/app_src_main_res_values_strings_xml.b64 | gzip -d > 'llama/examples/llama.android/app/src/main/res/values/strings.xml'

      - name: Prepare app_src_main_res_values_colors_xml
        run: mkdir -p "$(dirname 'llama/examples/llama.android/app/src/main/res/values/colors.xml')" && truncate -s 0 /tmp/app_src_main_res_values_colors_xml.b64

      - name: Write app_src_main_res_values_colors_xml 1
        run: printf '%s' 'H4sIAIKmsWoC/43QXQrCMAwH8HdPMeYB1s6NItRBZ+01JNYoONdCP8DjmwmKL1Lzf8wvIUQGjD4Hi3FYVVTS+rsPlYMZdzXcwB1P13pYM800b2Xz6v6SMYcLWCTOBcWUeAp+WvSGUXRBJ3wksqY3nREFO+eEZ8JKKTF2BQzWoltWH8S47fVf+n1Ny7li+8+IbL6++QT1dGGJWgEAAA==' >> /tmp/app_src_main_res_values_colors_xml.b64

      - name: Decode app_src_main_res_values_colors_xml
        run: base64 -d /tmp/app_src_main_res_values_colors_xml.b64 | gzip -d > 'llama/examples/llama.android/app/src/main/res/values/colors.xml'

      - name: Prepare app_src_main_java_com_example_llama_agentstore_kt
        run: mkdir -p "$(dirname 'llama/examples/llama.android/app/src/main/java/com/example/llama/AgentStore.kt')" && truncate -s 0 /tmp/app_src_main_java_com_example_llama_agentstore_kt.b64

      - name: Write app_src_main_java_com_example_llama_agentstore_kt 1
        run: printf '%s' '' >> /tmp/app_src_main_java_com_example_llama_agentstore_kt.b64

      - name: Write app_src_main_java_com_example_llama_agentstore_kt 2
        run: printf '%s' '' >> /tmp/app_src_main_java_com_example_llama_agentstore_kt.b64

      - name: Write app_src_main_java_com_example_llama_agentstore_kt 3
        run: printf '%s' '' >> /tmp/app_src_main_java_com_example_llama_agentstore_kt.b64

      - name: Write app_src_main_java_com_example_llama_agentstore_kt 4
        run: printf '%s' '' >> /tmp/app_src_main_java_com_example_llama_agentstore_kt.b64

      - name: Write app_src_main_java_com_example_llama_agentstore_kt 5
        run: printf '%s' '' >> /tmp/app_src_main_java_com_example_llama_agentstore_kt.b64

      - name: Decode app_src_main_java_com_example_llama_agentstore_kt
        run: base64 -d /tmp/app_src_main_java_com_example_llama_agentstore_kt.b64 | gzip -d > 'llama/examples/llama.android/app/src/main/java/com/example/llama/AgentStore.kt'

      - name: Prepare app_src_main_java_com_example_llama_mainactivity_kt
        run: mkdir -p "$(dirname 'llama/examples/llama.android/app/src/main/java/com/example/llama/MainActivity.kt')" && truncate -s 0 /tmp/app_src_main_java_com_example_llama_mainactivity_kt.b64

      - name: Write app_src_main_java_com_example_llama_mainactivity_kt 1
        run: printf '%s' '' >> /tmp/app_src_main_java_com_example_llama_mainactivity_kt.b64

      - name: Write app_src_main_java_com_example_llama_mainactivity_kt 2
        run: printf '%s' '' >> /tmp/app_src_main_java_com_example_llama_mainactivity_kt.b64

      - name: Write app_src_main_java_com_example_llama_mainactivity_kt 3
        run: printf '%s' '' >> /tmp/app_src_main_java_com_example_llama_mainactivity_kt.b64

      - name: Write app_src_main_java_com_example_llama_mainactivity_kt 4
        run: printf '%s' '' >> /tmp/app_src_main_java_com_example_llama_mainactivity_kt.b64

      - name: Write app_src_main_java_com_example_llama_mainactivity_kt 5
        run: printf '%s' '' >> /tmp/app_src_main_java_com_example_llama_mainactivity_kt.b64

      - name: Write app_src_main_java_com_example_llama_mainactivity_kt 6
        run: printf '%s' '' >> /tmp/app_src_main_java_com_example_llama_mainactivity_kt.b64

      - name: Write app_src_main_java_com_example_llama_mainactivity_kt 7
        run: printf '%s' '' >> /tmp/app_src_main_java_com_example_llama_mainactivity_kt.b64

      - name: Write app_src_main_java_com_example_llama_mainactivity_kt 8
        run: printf '%s' '' >> /tmp/app_src_main_java_com_example_llama_mainactivity_kt.b64

      - name: Write app_src_main_java_com_example_llama_mainactivity_kt 9
        run: printf '%s' '' >> /tmp/app_src_main_java_com_example_llama_mainactivity_kt.b64

      - name: Write app_src_main_java_com_example_llama_mainactivity_kt 10
        run: printf '%s' '' >> /tmp/app_src_main_java_com_example_llama_mainactivity_kt.b64

      - name: Write app_src_main_java_com_example_llama_mainactivity_kt 11
        run: printf '%s' '' >> /tmp/app_src_main_java_com_example_llama_mainactiv

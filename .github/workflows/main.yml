name: Build Ajan MG Full Alpha

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get llama.cpp Android source
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          path: llama
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Add Ajan MG agent commands
        run: echo "" | base64 -d > llama/examples/llama.android/app/src/main/java/com/example/llama/AgentCommands.kt

      - name: Patch local AI for memory and tools
        run: echo "" | base64 -d | python3

      - name: Apply Ajan MG branding
        run: echo "PHJlc291cmNlcz5cbiAgICA8c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj5BamFuIE0mYW1wO0cgRnVsbCBBbHBoYTwvc3RyaW5nPlxuPC9yZXNvdXJjZXM+XG4=" | base64 -d > llama/examples/llama.android/app/src/main/res/values/strings.xml

      - name: Apply Full Alpha manifest
        run: echo "" | base64 -d > llama/examples/llama.android/app/src/main/AndroidManifest.xml

      - name: Set unique package and version
        run: sed -i 's/applicationId = "com.example.llama.aichat"/applicationId = "com.mg.ajanfull"/; s/versionCode = 1/versionCode = 3/; s/versionName = "1.0"/versionName = "3.0-alpha"/' llama/examples/llama.android/app/build.gradle.kts

      - name: Accept Android licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android packages
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Build Full Alpha APK
        run: cd llama/examples/llama.android && chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp llama/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk Ajan-MG-Full-Alpha.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ajan-MG-Full-Alpha
          path: Ajan-MG-Full-Alpha.apk
          if-no-files-found: error

name: Build Ajan MG V8.1 Hybrid Agent
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  actions: read
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          path: llama
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Rebuild proven V4 base
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10667306678/zip > old1.zip
          unzip -o old1.zip
          gh api "repos/${{ github.repository }}/contents/.github/workflows/main.yml?ref=501acc8e0ec0cf98e4c66f7079de3cefb1e68ee9" --jq .content | tr -d '\n' | base64 -d > v4.yml
          sed -n "s/.*printf '%s' '\([^']*\)' >> AjanMG.part2.b64/\1/p" v4.yml | tr -d '\n' > AjanMG.part2.b64
          cat AjanMG.part1.b64 AjanMG.part2.b64 | base64 -d > source.tar.xz
          tar -xJf source.tar.xz -C llama/examples/llama.android
      - name: Write V8.1 hybrid source
        run: |
          printf '%s' '' > v81_overlay.b64
          printf '%s' '' >> v81_overlay.b64
          printf '%s' '' >> v81_overlay.b64

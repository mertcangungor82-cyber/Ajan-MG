name: Build Ajan MG V2 Local AI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get llama.cpp Android source
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: b29c606
          path: llama
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install required Android packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Build Local AI APK
        run: cd llama/examples/llama.android && chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp llama/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk Ajan-MG-V2-LocalAI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ajan-MG-V2-LocalAI
          path: Ajan-MG-V2-LocalAI.apk
          if-no-files-found: error

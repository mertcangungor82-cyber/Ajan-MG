          printf '%s' 'c07EuCX/Sh1P029YYWAthR9pt3BuH3rrHZoxIN6ewjN8mk8ZXngzTfh0bPQ3g1HrhF7GNRoVTydPD/2cPu2OIojWc3hIDcIGrD6aLU4fkH/vdUA3AZQMsL7wlz1mxsdX5xvrgCAzxYYc3YOmETbNqf8q3wTWq1CzaJPgAAAAGYU4BzkgDdkAAYegAoDwCxWElXixxGf7AgAAAAAEWVo=' >> v8_overlay.b64
          base64 -d v8_overlay.b64 > v8_overlay.tar.xz
          test "$(sha256sum v8_overlay.tar.xz | cut -d' ' -f1)" = "cdd26d0daa67f56e5d0aa0b52d70949bada392d82f866898cdc1a31616883230"
          tar -xJf v8_overlay.tar.xz -C llama/examples/llama.android
      - name: Static V8 checks
        run: |
          cd llama/examples/llama.android
          grep -q 'gemini-3.8-flash' app/src/main/java/com/example/llama/GeminiApi.kt
          grep -q 'gemini-3.1-flash-image' app/src/main/java/com/example/llama/GeminiApi.kt
          grep -q 'lyria-3.5' app/src/main/java/com/example/llama/GeminiApi.kt
          grep -q 'veo-3.1-generate-preview' app/src/main/java/com/example/llama/GeminiApi.kt
          grep -q 'class CameraActivity' app/src/main/java/com/example/llama/CameraActivity.kt
          grep -q 'android.permission.CAMERA' app/src/main/AndroidManifest.xml
          grep -q 'USAGE_ASSISTANT' app/src/main/java/com/example/llama/MainActivity.kt
          grep -q 'KeyProperties' app/src/main/java/com/example/llama/SecureSecrets.kt
          python3 -m py_compile app/src/main/assets/ajan_mg_pc_bridge.py
      - name: Android SDK
        run: |
          sed -i 's/applicationId = "com.example.llama.aichat"/applicationId = "com.mg.ajanfull"/;s/versionCode = 1/versionCode = 14/;s/versionName = "1.0"/versionName = "1.4.0"/' llama/examples/llama.android/app/build.gradle.kts
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Build and verify APK
        run: |
          cd llama/examples/llama.android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" "$GITHUB_WORKSPACE/Ajan-MG-V8.apk"
          sha256sum "$GITHUB_WORKSPACE/Ajan-MG-V8.apk"
      - name: Upload Ajan M&G V8
        uses: actions/upload-artifact@v4
        with:
          name: Ajan-MG-V8
          path: Ajan-MG-V8.apk
          if-no-files-found: error

name: Build Ajan MG V7 Agent Core
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  actions: read
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          path: llama
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Rebuild V4 base
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10667306678/zip > old1.zip
          unzip -o old1.zip
          gh api "repos/${{ github.repository }}/contents/.github/workflows/main.yml?ref=501acc8e0ec0cf98e4c66f7079de3cefb1e68ee9" --jq .content | tr -d '\n' | base64 -d > v4.yml
          sed -n "s/.*printf '%s' '\([^']*\)' >> AjanMG.part2.b64/\1/p" v4.yml | tr -d '\n' > AjanMG.part2.b64
          cat AjanMG.part1.b64 AjanMG.part2.b64 | base64 -d > source.tar.xz
          tar -xJf source.tar.xz -C llama/examples/llama.android
      - name: Rebuild V5 base
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10677419918/zip > v5p1.zip
          unzip -o v5p1.zip
          gh api "repos/${{ github.repository }}/contents/.github/workflows/main.yml?ref=23979ac22a393d01ddacf6aa6952d43e3efc8dab" --jq .content | tr -d '\n' | base64 -d > v5.yml
          sed -n "s/.*printf '%s' '\([^']*\)' >> v5.patch.part2.b64/\1/p" v5.yml | tr -d '\n' > v5.patch.part2.b64
          cat v5.patch.part1.b64 v5.patch.part2.b64 | base64 -d | xz -d > v5.patch
          cd llama/examples/llama.android && patch -p1 < "$GITHUB_WORKSPACE/v5.patch"
      - name: Download V7 part 1
        run: |
          ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=AjanMG-V7-Patch-Part1&per_page=100" --jq '.artifacts | sort_by(.created_at) | last | .id')
          test -n "$ID" && test "$ID" != null
          gh api "repos/${{ github.repository }}/actions/artifacts/$ID/zip" > v7p1.zip
          unzip -o v7p1.zip
      - name: Write V7 part 2
        run: |
          truncate -s 0 v7.patch.part2.b64
          printf '%s' '' >> v7.patch.part2.b64
          printf '%s' '' >> v7.patch.part2.b64
          printf '%s' '' >> v7.patch.part2.b64
          printf '%s' '' >> v7.patch.part2.b64
          printf '%s' '' >> v7.patch.part2.b64
          printf '%s' '' >> v7.patch.part2.b64
          printf '%s' '' >> v7.patch.part2.b64
          printf '%s' '' >> v7.patch.part2.b64
          printf '%s' '' >> v7.patch.part2.b64
          printf '%s' '' >> v7.patch.part2.b64
          printf '%s' '' >> v7.patch.part2.b64
          printf '%s' '' >> v7.patch.part2.b64
          printf '%s' '' >> v7.patch.part2.b64
          printf '%s' '' >> v7.patch.part2.b64
          printf '%s' '' >> v7.patch.part2.b64
          test $(wc -c < v7.patch.part2.b64) -eq 7776
      - name: Apply V7
        run: |
          cat v7.patch.part1.b64 v7.patch.part2.b64 | base64 -d | xz -d > v7.patch
          cd llama/examples/llama.android
          patch -p1 < "$GITHUB_WORKSPACE/v7.patch"
          sed -i '153s/\\s+/\\\\s+/' app/src/main/java/com/example/llama/WebResearch.kt
          grep -q selfImproveEnabled app/src/main/java/com/example/llama/AgentStore.kt
          grep -q site.api.espn.com app/src/main/java/com/example/llama/WebResearch.kt
          grep -q USAGE_ASSISTANT app/src/main/java/com/example/llama/MainActivity.kt
      - name: Android SDK
        run: |
          sed -i 's/applicationId = "com.example.llama.aichat"/applicationId = "com.mg.ajanfull"/;s/versionCode = 1/versionCode = 13/;s/versionName = "1.0"/versionName = "1.3.0"/' llama/examples/llama.android/app/build.gradle.kts
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Build APK
        run: |
          cd llama/examples/llama.android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Ajan-MG-V7.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Ajan-MG-V7
          path: Ajan-MG-V7.apk
          if-no-files-found: error

name: Build Ajan MG V8.2 Multi API Agent
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  actions: read
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          path: llama
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Rebuild proven V4 base
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10667306678/zip > old1.zip
          unzip -o old1.zip
          gh api "repos/${{ github.repository }}/contents/.github/workflows/main.yml?ref=501acc8e0ec0cf98e4c66f7079de3cefb1e68ee9" --jq .content | tr -d '\n' | base64 -d > v4.yml
          sed -n "s/.*printf '%s' '\([^']*\)' >> AjanMG.part2.b64/\1/p" v4.yml | tr -d '\n' > AjanMG.part2.b64
          cat AjanMG.part1.b64 AjanMG.part2.b64 | base64 -d > source.tar.xz
          tar -xJf source.tar.xz -C llama/examples/llama.android
      - name: Apply V8.2 multi API source
        run: |
          gh api "repos/${{ github.repository }}/contents/.github/workflows/AjanMG-V8.2-overlay.tar.xz?ref=${{ github.sha }}" --jq .content | tr -d '\n' | base64 -d > v82_overlay.tar.xz
          test "$(sha256sum v82_overlay.tar.xz | cut -d' ' -f1)" = "adf01170419ee44ac1e220ab5935b7d12164392cb527ed4c7cc2c30540a84ae9"
          tar -xJf v82_overlay.tar.xz -C llama/examples/llama.android
      - name: Static checks
        run: |
          cd llama/examples/llama.android
          grep -q 'api.groq.com/openai/v1' app/src/main/java/com/example/llama/MainActivity.kt
          grep -q 'integrate.api.nvidia.com/v1' app/src/main/java/com/example/llama/MainActivity.kt
          grep -q 'nvidia/nemotron-3-ultra-550b-a55b' app/src/main/java/com/example/llama/MainActivity.kt
          grep -q 'custom_api_key' app/src/main/java/com/example/llama/MainActivity.kt
          grep -q 'chat_template_kwargs' app/src/main/java/com/example/llama/OpenAiCompatibleApi.kt
          grep -q 'KeyProperties' app/src/main/java/com/example/llama/SecureSecrets.kt
          grep -q 'class CameraActivity' app/src/main/java/com/example/llama/CameraActivity.kt
          python3 -m py_compile app/src/main/assets/ajan_mg_pc_bridge.py
      - name: Android SDK
        run: |
          sed -i 's/applicationId = "com.example.llama.aichat"/applicationId = "com.mg.ajanfull"/;s/versionCode = 1/versionCode = 16/;s/versionName = "1.0"/versionName = "1.4.2"/' llama/examples/llama.android/app/build.gradle.kts
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Build and verify APK
        run: |
          cd llama/examples/llama.android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" "$GITHUB_WORKSPACE/Ajan-MG-V8.2.apk"
          sha256sum "$GITHUB_WORKSPACE/Ajan-MG-V8.2.apk"
      - name: Upload Ajan M&G V8.2
        uses: actions/upload-artifact@v4
        with:
          name: Ajan-MG-V8.2
          path: Ajan-MG-V8.2.apk
          if-no-files-found: error

name: Build Ajan MG Full Beta Web Voice Safe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get llama.cpp Android source
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          path: llama
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Write agent 1
        run: printf '%s' '' > /tmp/agent.b64

      - name: Write agent 2
        run: printf '%s' '' >> /tmp/agent.b64

      - name: Write agent 3
        run: printf '%s' '' >> /tmp/agent.b64

      - name: Write agent 4
        run: printf '%s' '' >> /tmp/agent.b64

      - name: Write agent 5
        run: printf '%s' '' >> /tmp/agent.b64

      - name: Write agent 6
        run: printf '%s' '' >> /tmp/agent.b64

      - name: Decode agent
        run: base64 -d /tmp/agent.b64 > llama/examples/llama.android/app/src/main/java/com/example/llama/Agent.kt

      - name: Write web 1
        run: printf '%s' '' > /tmp/web.b64

      - name: Write web 2
        run: printf '%s' '' >> /tmp/web.b64

      - name: Write web 3
        run: printf '%s' '' >> /tmp/web.b64

      - name: Write web 4
        run: printf '%s' '' >> /tmp/web.b64

      - name: Write web 5
        run: printf '%s' '' >> /tmp/web.b64

      - name: Write web 6
        run: printf '%s' '' >> /tmp/web.b64

      - name: Write web 7
        run: printf '%s' '' >> /tmp/web.b64

      - name: Write web 8
        run: printf '%s' '' >> /tmp/web.b64

      - name: Write web 9
        run: printf '%s' 'ICAgICAucmVwbGFjZSgiJiMzOTsiLCAiJyIpCiAgICAgICAgLnJlcGxhY2UoUmVnZXgoIlxccysiKSwgIiAiKQogICAgICAgIC50cmltKCkKfQo=' >> /tmp/web.b64

      - name: Decode web
        run: base64 -d /tmp/web.b64 > llama/examples/llama.android/app/src/main/java/com/example/llama/WebResearch.kt

      - name: Write patch 1
        run: printf '%s' '' > /tmp/patch.b64

      - name: Write patch 2
        run: printf '%s' '' >> /tmp/patch.b64

      - name: Write patch 3
        run: printf '%s' '' >> /tmp/patch.b64

      - name: Write patch 4
        run: printf '%s' '' >> /tmp/patch.b64

      - name: Write patch 5
        run: printf '%s' '' >> /tmp/patch.b64

      - name: Write patch 6
        run: printf '%s' '' >> /tmp/patch.b64

      - name: Write patch 7
        run: printf '%s' '' >> /tmp/patch.b64

      - name: Decode patch
        run: base64 -d /tmp/patch.b64 > /tmp/patch.py


      - name: Patch MainActivity
        run: python3 /tmp/patch.py

      - name: Branding and internet
        run: printf '%s\n' '<resources>' ' <string name="app_name">Ajan M&amp;G Full Beta</string>' '</resources>' > llama/examples/llama.android/app/src/main/res/values/strings.xml && sed -i '/<manifest/a\ <uses-permission android:name="android.permission.INTERNET" />' llama/examples/llama.android/app/src/main/AndroidManifest.xml

      - name: Set package and version
        run: sed -i 's/applicationId = "com.example.llama.aichat"/applicationId = "com.mg.ajanfull"/; s/versionCode = 1/versionCode = 5/; s/versionName = "1.0"/versionName = "4.1-beta"/' llama/examples/llama.android/app/build.gradle.kts

      - name: Accept Android licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android packages
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Build Full Beta APK
        run: cd llama/examples/llama.android && chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp llama/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk Ajan-MG-Full-Beta-WebVoice.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ajan-MG-Full-Beta-WebVoice
          path: Ajan-MG-Full-Beta-WebVoice.apk
          if-no-files-found: error
